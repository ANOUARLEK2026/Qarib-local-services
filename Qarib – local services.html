<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e5d52"><link rel="icon" href="icon-192.png"><title>Qarib – local services</title>

<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#12302b;--mute:#5b706b;--line:#d5dfdc;--brand:#0e5d52;--brand-ink:#fff;--sun:#f0a52c;--wa:#1fa855;--wa-ink:#fff;--star:#e08a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1917;--surface:#152724;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403b;--brand:#59c7b3;--brand-ink:#08201c;--sun:#f0b24a;--wa:#2bbf6a;--star:#f0b24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1917;--surface:#152724;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403b;--brand:#59c7b3;--brand-ink:#08201c;--sun:#f0b24a;--wa:#2bbf6a;--star:#f0b24a;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#152724}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Cairo,system-ui,Segoe UI,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:22px;color:var(--brand);letter-spacing:.2px}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
h1{font-size:clamp(30px,7vw,48px);line-height:1.1;margin:28px 0 6px;font-weight:800;max-width:14ch}
.sub{color:var(--mute);margin:0 0 18px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.search:focus,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 14px;color:var(--mute)}
.bar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:start}
.card:hover{border-color:var(--brand)}
.top{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.name{font-weight:600;line-height:1.2}
.meta{color:var(--mute);font-size:14px}
.stars{color:var(--star);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--wa);margin-inline-end:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wa{background:var(--wa);color:var(--wa-ink);border:0;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
.heart{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;color:var(--mute)}
.heart[aria-pressed="true"]{color:#d6455d}
.fab{margin-top:22px;width:100%;background:var(--sun);color:#2a1d00;border:0;border-radius:14px;padding:14px;font-weight:800;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 4px}
.rev{border-top:1px solid var(--line);padding:10px 0}
.field{display:grid;gap:4px;margin:10px 0}
.field input,.field select,.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:28px;cursor:pointer;color:var(--line);padding:0}
.rate button.on{color:var(--star)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.empty{padding:30px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:16px}
body{padding-bottom:78px}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{flex:1;background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--mute);font-size:13px}
nav button[aria-pressed="true"]{color:var(--brand);font-weight:800}
nav button b{display:block;font-size:20px;font-weight:400}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:30}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}
.stat b{display:block;font-size:24px;color:var(--ink)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.box select,.box input,.box textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
</style>
</head>
